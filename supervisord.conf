[supervisord]
nodaemon=false
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:narsil]
command=narsil-mcp --repos . --reindex --persist --call-graph --graph --index-path .narsil --watch --socket-conn /tmp/narsil_mcp
autorestart=true
startretries=999
stdout_logfile=/var/log/narsil.stdout.log
stderr_logfile=/var/log/narsil.stderr.log
